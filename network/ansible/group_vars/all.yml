# The desired state of the switch. One source of truth for both the baseline script and
# the audit, which is what makes "audit" meaningful: they read the same values.
switch_baseline:
  hostname: gs108tv3
  zonename: America/Toronto
  timezone: EST5EDT,M3.2.0,M11.1.0
  ntp_servers:
    - 192.168.10.1              # the router runs ntpd; keeps time right with the WAN down
    - 0.openwrt.pool.ntp.org   # fallback only
  lan_ipaddr: 192.168.10.3/24
  lan_gateway: 192.168.10.1
  lan_dns: 192.168.10.1
  # A switch must not hand out addresses: this device bridges the OPNsense LAN, so a
  # DHCP server here would be a rogue one.
  dnsmasq_enabled: false
  odhcpd_enabled: false
  stp: true
  igmp_snooping: true
  # 802.1Q, DSA-style (OpenWrt 21+). VLAN 1 is the management/infra network and stays
  # untagged on every port, so nothing that already works changes when a tagged VLAN is
  # added. VLAN 20 is the *clients* network and is only tagged where it must travel:
  # lan1 (OPNsense) and lan2 (the AP). The cluster's ports never see it.
  #
  # 2026-11-01: added so segmentation stops being a graph on paper. A tagged VLAN that
  # no port carries is inert; this one is carried to the two devices that need it.
  vlans:
    - vlan: 1
      ports: ["lan1", "lan2", "lan3", "lan4", "lan5", "lan6", "lan7", "lan8"]
    - vlan: 20
      ports: ["lan1:t", "lan2:t"]
    # VLAN 30 (IoT) — the same two ports: lan1 is the router uplink, lan2 is the AP. A tagged
    # VLAN that no client uses is inert, so this can land before the AP has an SSID for it;
    # what it cannot do is arrive *after* the SSID, or the first IoT device joins a network
    # the switch drops frames for (2026-11-03).
    - vlan: 30
      ports: ["lan1:t", "lan2:t"]
  # The key that must exist BEFORE password auth is turned off. Public keys are not secrets,
  # so this belongs in git - and it has to, because the alternative is unreproducible: after a
  # factory reset (2026-11-01, recovering the switch from failsafe) the key was gone while the
  # baseline would still have disabled passwords, which locks everyone out of the device.
  ssh_authorized_keys:
    - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILj/syjQTnLwTGNHC4IKec2QXJpzXOExBQKGJI6/p4Mz nix-station-opencode"

  # Management plane. Verified on the device 2026-11-01: PasswordAuth and RootPasswordAuth
  # were both 'on' and LuCI redirected nothing, despite ROUTER.md claiming key-only SSH.
  # That matters more now that Wi-Fi clients share this L2 island and can reach .3.
  # Disabling password auth is safe *because* the ed25519 key is in
  # /etc/dropbear/authorized_keys (1 line, verified) and every access since the flash has
  # been key-based.
  ssh_password_auth: false
  ssh_root_password_auth: false
  luci_redirect_https: true

# Identity/access state for the router. The OpenTofu provider has no `system` resource, so this is
# its only declarative home. Applied by playbooks/opnsense-baseline.yml.
#
# NOT here: TOTP (a seed has to be enrolled in a human's authenticator — automating it either
# locks someone out or writes a secret that cannot be verified), and the VLAN interface objects
# (writing them produces something OPNsense does not enumerate — ROUTER.md 7c).
opnsense_baseline:
  # The ISP gateway drops ICMP, so monitoring it reports a permanent outage.
  # Verified 2026-11-03: 100% loss to 142.124.37.107, replies from 1.1.1.1.
  gateway_monitor_ip: "1.1.1.1"
  ssh_authorized_keys:
    - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILj/syjQTnLwTGNHC4IKec2QXJpzXOExBQKGJI6/p4Mz nix-station-opencode"
  # Interlocked: the baseline refuses to disable passwords unless a key would remain.
  disable_password_auth: true
  # 60 minutes idle, 5 minutes to finish a login (both unset by default = effectively unbounded).
  webgui_session_timeout: "60"
  webgui_auth_timeout: "5"

  # The two facts OpenTofu cannot express, so they live here instead. Both are load-bearing: lose
  # either and VLAN 20 has no address and no DHCP while every declarative resource still matches.
  kea_interfaces: "lan,opt1"
  vlan_interface:
    handle: "opt1"
    descr: "CLIENTS"
    ipaddr: "192.168.20.1"
    subnet: "24"
