# Apply (or audit) the OPNsense identity/access baseline.
#
#   ansible-playbook playbooks/opnsense.yml              # apply, report what changed
#   ansible-playbook playbooks/opnsense.yml -e audit=1   # read-only drift report, fails on drift
#   ansible-playbook playbooks/opnsense.yml --check      # same as -e audit=1
#
# The router has no Python, so this uses `script` (Ansible copies the rendered baseline over
# SSH and runs it). Idempotency lives in the script: it compares every value before writing,
# and prints OK/CHANGED/DRIFT lines.
- name: gw-opnsense — identity and access
  hosts: opnsense
  gather_facts: false
  tasks:
    # check_mode: no on both tasks. The rendering has to happen for real or `rendered` has no
    # .dest (which is what used to make --check explode); the script has to run for real or
    # there is nothing to report. The safety comes from passing --audit under --check, so the
    # script only reads the router.
    - name: render the baseline with this group's values
      ansible.builtin.template:
        src: ../files/opnsense_baseline.sh.j2
        dest: "{{ lookup('env', 'TMPDIR') | default('/tmp', true) }}/opnsense_baseline_gw.sh"
        mode: "0755"
      delegate_to: localhost
      check_mode: no
      changed_when: false
      register: rendered

    - name: run it on the router (apply, or audit under --check / -e audit=1)
      ansible.builtin.script:
        cmd: "{{ rendered.dest }}{{ ' --audit' if ((audit | default('0')) == '1' or ansible_check_mode) else '' }}"
      check_mode: no
      register: result
      changed_when: "'CHANGED:' in result.stdout"
      failed_when: result.rc not in [0, 2]

    - name: report
      ansible.builtin.debug:
        msg: "{{ result.stdout_lines | default([]) }}"

    - name: fail when auditing and drift was found
      ansible.builtin.fail:
        msg: "drift detected — rerun without --check / -e audit=1 to correct it"
      when: ((audit | default('0')) == '1' or ansible_check_mode) and result.rc == 2
