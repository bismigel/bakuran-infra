[defaults]
inventory = inventory.yml
host_key_checking = False
stdout_callback = default
interpreter_python = auto_silent

# The OPNsense collection is the API client the `router` plays use; it is installed into ./collections from
# requirements.yml, not committed (306 vendored files were tracked for weeks because the ignore pattern pointed at
# ansible/ansible/collections - see docs/legacy-scripts.md).
collections_path = ./collections
