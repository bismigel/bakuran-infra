# Shared scrape config, one copy for each backend so the comparison is apples-to-apples.
# Same targets, same interval (30s), same labels. Each backend consumes this through its own
# mechanism: Prometheus and VictoriaMetrics scrape directly; Mimir receives it via a Prometheus
# agent that remote-writes (Mimir does not scrape).
apiVersion: v1
kind: ConfigMap
metadata:
  name: scrape-config
  namespace: observability
data:
  scrape.yml: |
    global:
      scrape_interval: 30s
    scrape_configs:
      - job_name: node-exporter
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics
        scheme: https
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          insecure_skip_verify: true
      - job_name: kube-state-metrics
        static_configs:
          - targets: ['kube-state-metrics.observability.svc:8080']
      - job_name: coredns
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [kube-system]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: kube-dns
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: metrics
            action: keep
