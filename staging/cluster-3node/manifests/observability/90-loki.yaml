# Loki single-binary: the log store. Filesystem backend + tsdb schema, replication 1 -
# the homelab shape, not the "simple-scalable" fleet. The comparison question for logs is
# "is a store worth running at all", not "can Loki scale", so keep it minimal.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: observability
data:
  loki.yml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels: { app: loki }
  template:
    metadata:
      labels: { app: loki }
    spec:
      containers:
        - name: loki
          image: grafana/loki:2.9.10
          args: ['-config.file=/etc/loki/loki.yml']
          ports: [{ containerPort: 3100, name: http }]
          volumeMounts:
            - { name: config, mountPath: /etc/loki, readOnly: true }
            - { name: storage, mountPath: /loki }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: config
          configMap: { name: loki-config }
        - name: storage
          persistentVolumeClaim: { claimName: loki }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki
  namespace: observability
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 2Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: observability
spec:
  selector: { app: loki }
  ports: [{ port: 3100, name: http }]
