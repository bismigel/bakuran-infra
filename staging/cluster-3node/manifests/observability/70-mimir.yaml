# Candidate B: Mimir (the LGTM metrics leg), monolithic, filesystem blocks.
# Mimir does NOT scrape - the Prometheus agent remote-writes to it (80/85).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mimir
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels: { app: mimir }
  template:
    metadata:
      labels: { app: mimir }
    spec:
      containers:
        - name: mimir
          image: grafana/mimir:2.13.0
          args:
            - -target=all
            - -auth.multitenancy-enabled=false
            - -blocks-storage.backend=filesystem
            - -blocks-storage.filesystem.dir=/data/blocks
            - -ruler-storage.backend=filesystem
            - -ruler-storage.filesystem.dir=/data/ruler
            # Single instance: the ring defaults expect 3 ingesters, so one never becomes ACTIVE and every
            # push 500s with "send data to ingesters". In-memory rings + replication factor 1 is the
            # monolithic recipe. The store flag is `.ring.store`, NOT `.ring.kvstore.store` (that one
            # crashes the binary: "flag provided but not defined").
            - -ingester.ring.replication-factor=1
            - -ingester.ring.store=inmemory
            - -distributor.ring.store=inmemory
            - -store-gateway.sharding-ring.store=inmemory
            - -compactor.ring.store=inmemory
          ports:
            - { containerPort: 8080, name: http }
            - { containerPort: 9009, name: grpc }
          volumeMounts:
            - { name: storage, mountPath: /data }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: storage
          persistentVolumeClaim: { claimName: mimir }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mimir
  namespace: observability
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 2Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: mimir
  namespace: observability
spec:
  selector: { app: mimir }
  ports:
    - { port: 8080, name: http }
    - { port: 9009, name: grpc }
