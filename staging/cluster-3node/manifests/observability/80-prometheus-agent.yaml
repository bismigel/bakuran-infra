# The scrape leg for Mimir: Prometheus in agent mode (no local TSDB) remote-writes the same jobs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-agent
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-agent
rules:
  - apiGroups: [""]
    resources: [nodes, services, endpoints, pods, nodes/proxy]
    verbs: [get, list, watch]
  - nonResourceURLs: ["/metrics"]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-agent
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: prometheus-agent }
subjects: [{ kind: ServiceAccount, name: prometheus-agent, namespace: observability }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-agent
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus-agent }
  template:
    metadata:
      labels: { app: prometheus-agent }
    spec:
      serviceAccountName: prometheus-agent
      containers:
        - name: prometheus-agent
          image: prom/prometheus:v2.51.0
          args:
            - --enable-feature=agent
            - --config.file=/etc/prometheus/agent.yml
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus, readOnly: true }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: config
          configMap: { name: agent-config }
