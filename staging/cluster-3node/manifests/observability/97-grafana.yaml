# Grafana for the comparison: one datasource (Prometheus, which scrapes both backends) and one dashboard
# whose panels read the two backends' own management metrics side by side.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: observability
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prom
        type: prometheus
        access: proxy
        url: http://prometheus.observability.svc:9090
        isDefault: true
      - name: VictoriaMetrics
        uid: vm
        type: prometheus
        access: proxy
        url: http://victoriametrics.observability.svc:8428
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: observability
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: default
        folder: ""
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-comparison
  namespace: observability
data:
  comparison.json: |
    {
      "uid": "compare-tsdb",
      "title": "TSDB comparison — Prometheus vs VictoriaMetrics",
      "tags": ["staging", "comparison"],
      "timezone": "utc",
      "time": { "from": "now-3h", "to": "now" },
      "refresh": "30s",
      "schemaVersion": 39,
      "panels": [
        {
          "id": 1, "type": "timeseries", "title": "Resident memory (MiB) — lower is better",
          "datasource": { "type": "prometheus", "uid": "prom" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "deci-MiB" }, "overrides": [] },
          "targets": [
            { "refId": "A", "legendFormat": "Prometheus", "expr": "process_resident_memory_bytes{job=\"prometheus-self\"} / 1048576" },
            { "refId": "B", "legendFormat": "VictoriaMetrics", "expr": "process_resident_memory_bytes{job=\"victoriametrics-self\"} / 1048576" }
          ]
        },
        {
          "id": 2, "type": "timeseries", "title": "Head series (what is being stored)",
          "datasource": { "type": "prometheus", "uid": "prom" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            { "refId": "A", "legendFormat": "Prometheus head series", "expr": "prometheus_tsdb_head_series{job=\"prometheus-self\"}" },
            { "refId": "B", "legendFormat": "avalanche series seen (either backend)", "expr": "count(avalanche_metric)" }
          ]
        },
        {
          "id": 3, "type": "timeseries", "title": "Ingest rate (samples or rows per second)",
          "datasource": { "type": "prometheus", "uid": "prom" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            { "refId": "A", "legendFormat": "Prometheus appended", "expr": "sum(rate(prometheus_tsdb_head_samples_appended_total{job=\"prometheus-self\"}[5m]))" },
            { "refId": "B", "legendFormat": "VictoriaMetrics ingested", "expr": "sum(rate(vm_rows_inserted_total{job=\"victoriametrics-self\"}[5m]))" }
          ]
        },
        {
          "id": 4, "type": "timeseries", "title": "CPU cores used",
          "datasource": { "type": "prometheus", "uid": "prom" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            { "refId": "A", "legendFormat": "Prometheus", "expr": "rate(process_cpu_seconds_total{job=\"prometheus-self\"}[5m])" },
            { "refId": "B", "legendFormat": "VictoriaMetrics", "expr": "rate(process_cpu_seconds_total{job=\"victoriametrics-self\"}[5m])" }
          ]
        },
        {
          "id": 5, "type": "timeseries", "title": "Query latency — same PromQL through each backend (Mixed datasource)",
          "datasource": { "type": "datasource", "uid": "-- Mixed --" },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 16 },
          "targets": [
            { "refId": "A", "datasource": { "type": "prometheus", "uid": "prom" }, "legendFormat": "Prometheus", "expr": "sum(rate(avalanche_metric[5m]))" },
            { "refId": "B", "datasource": { "type": "prometheus", "uid": "vm" }, "legendFormat": "VictoriaMetrics", "expr": "sum(rate(avalanche_metric[5m]))" }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: observability
spec:
  replicas: 1
  # Same reason as every other PVC-backed Deployment here: RWO volume + RollingUpdate deadlocks.
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: grafana }
  template:
    metadata:
      labels: { app: grafana }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          env:
            # SQLite on a small staging node loses the lock race during provisioning ("Could not set default
            # permissions ... database is locked"), so WAL + a single writer connection. Recorded because it is
            # a staging-hardware symptom, not a Grafana misconfiguration.
            - { name: GF_DATABASE_WAL, value: "true" }
            - { name: GF_DATABASE_MAX_OPEN_CONN, value: "1" }
            - { name: GF_SECURITY_ADMIN_PASSWORD, value: "staging" }
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: "Viewer" }
            - { name: GF_AUTH_DISABLE_LOGIN_FORM, value: "true" }
            - { name: GF_ANALYTICS_REPORTING_ENABLED, value: "false" }
          ports: [{ containerPort: 3000, name: http }]
          volumeMounts:
            # Persist /var/lib/grafana so the SQLite migrations run ONCE. Without it, every restart replays
            # every migration and dashboard provisioning fails with "database is locked" - measured here on a
            # node this small, where the migration storm outlasts Grafana's retry budget.
            - { name: db, mountPath: /var/lib/grafana }
            - { name: datasources, mountPath: /etc/grafana/provisioning/datasources, readOnly: true }
            - { name: provider, mountPath: /etc/grafana/provisioning/dashboards, readOnly: true }
            - { name: dashboards, mountPath: /var/lib/grafana/dashboards, readOnly: true }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
      volumes:
        - name: db
          persistentVolumeClaim: { claimName: grafana }
        - name: datasources
          configMap: { name: grafana-datasources }
        - name: provider
          configMap: { name: grafana-dashboard-provider }
        - name: dashboards
          configMap: { name: grafana-dashboard-comparison }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana
  namespace: observability
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: observability
spec:
  type: NodePort
  selector: { app: grafana }
  ports:
    - { port: 3000, targetPort: 3000, nodePort: 30300, name: http }
