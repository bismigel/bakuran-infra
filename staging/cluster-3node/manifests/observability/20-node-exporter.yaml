apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: observability
spec:
  selector:
    matchLabels: { app: node-exporter }
  template:
    metadata:
      labels: { app: node-exporter }
    spec:
      hostNetwork: true
      hostPID: true
      containers:
        - name: node-exporter
          image: prom/node-exporter:v1.8.2
          args: ['--path.rootfs=/host']
          ports: [{ containerPort: 9100, name: metrics }]
          volumeMounts:
            - { name: root, mountPath: /host, readOnly: true }
      tolerations:
        - operator: Exists
      volumes:
        - name: root
          hostPath: { path: / }
