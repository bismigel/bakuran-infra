# Candidate A: single binary, PromQL drop-in, same scrape config.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: victoriametrics
  namespace: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: victoriametrics
rules:
  - apiGroups: [""]
    resources: [nodes, services, endpoints, pods, nodes/proxy]
    verbs: [get, list, watch]
  - nonResourceURLs: ["/metrics"]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: victoriametrics
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: victoriametrics }
subjects: [{ kind: ServiceAccount, name: victoriametrics, namespace: observability }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoriametrics
  namespace: observability
spec:
  replicas: 1
  # Recreate, not RollingUpdate: the PVC is ReadWriteOnce, so a new pod cannot mount it while the old one
  # still holds it - a rolling update deadlocks with both pods Pending/Error and the volume stuck on the old
  # node. Measured 2026-11-20: prometheus and victoriametrics each sat with two ReplicaSets fighting over one
  # volume until this was set.
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: victoriametrics }
  template:
    metadata:
      labels: { app: victoriametrics }
    spec:
      serviceAccountName: victoriametrics
      containers:
        - name: victoriametrics
          image: victoriametrics/victoria-metrics:v1.93.14
          args:
            - -promscrape.config=/etc/vm/scrape.yml
            - -storageDataPath=/storage
            - -retentionPeriod=7d
          ports: [{ containerPort: 8428, name: http }]
          volumeMounts:
            - { name: config, mountPath: /etc/vm, readOnly: true }
            - { name: storage, mountPath: /storage }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: config
          configMap: { name: scrape-config }
        - name: storage
          persistentVolumeClaim: { claimName: victoriametrics }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: victoriametrics
  namespace: observability
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 2Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: victoriametrics
  namespace: observability
spec:
  selector: { app: victoriametrics }
  ports: [{ port: 8428, name: http }]
