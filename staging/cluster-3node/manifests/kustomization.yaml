# What staging's ArgoCD manages. Deliberately small: staging exists to rehearse
# the *mechanism*, not to duplicate production's app set.
#
# The point of this directory: with automated+selfHeal+prune, anything edited or
# deleted in the cluster is put back from git. That is what makes staging
# "GitOps" rather than "Git-applied-at-boot".
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# NO `namespace:` here. It would override the namespace of EVERY resource,
# including kube-vip.yaml (which belongs in kube-system) - so ArgoCD managed a
# phantom kube-vip in staging-demo while the real one in kube-system kept its old
# spec. Each file declares its own namespace instead.

resources:
  # The API VIP. It is ALSO applied once at boot by the staging-kube-vip unit,
  # because the guest needs the address before ArgoCD can schedule anything.
  # From here on ArgoCD owns it, so drift is corrected - the same "bootstrap
  # applies it, ArgoCD adopts it" shape production uses.
  - kube-vip.yaml
  - demo.yaml

# No labels block at all. `commonLabels` rewrites `spec.selector`, which is
# immutable on a DaemonSet/Deployment, and even `labels[].includeSelectors: false`
# still produced an immutable-selector rejection on ArgoCD's render here. Staging
# does not need inventory labels badly enough to fight an immutable field: the
# Application name already says what owns these objects.
