# Staging's API VIP — the same shape as production's
# (bakuran-gitops/manifests/base/monitoring/kube-vip.yaml), scaled to one guest.
#
# Why this exists: production's Cilium points at 192.168.10.100, held by kube-vip.
# That creates an ordering constraint the staging host could not rehearse at all:
# on a cold boot the Cilium agents start before the address exists, and an agent
# that cannot reach the API stalls in `Init` until the VIP appears. See
# staging/README.md, "Rehearsal log".
#
# The manifest is applied by the `staging-kube-vip` unit, deliberately AFTER the
# Cilium install. That ordering is the rehearsal: it recreates the window in which
# the agents have no VIP to talk to.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-vip
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-vip-staging
rules:
  - apiGroups: [""]
    resources: ["services", "services/status", "nodes", "endpoints", "namespaces"]
    verbs: ["list", "get", "watch", "update"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["list", "get", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list", "get", "watch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-vip-staging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-vip-staging
subjects:
  - kind: ServiceAccount
    name: kube-vip
    namespace: kube-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-vip
  namespace: kube-system
spec:
  # ONE POD PER CONTROL-PLANE NODE, exactly like production - not a Deployment.
  # This was a 2-replica Deployment until 2026-10-28, which put two kube-vip
  # processes in the SAME host network namespace: they share the interface, so they
  # fight over the same address (flapping VIP, one pod in CrashLoopBackOff with
  # exit 1). Production has always been a DaemonSet; the staging copy was wrong.
  selector:
    matchLabels:
      app: kube-vip
  template:
    metadata:
      labels:
        app: kube-vip
    spec:
      hostNetwork: true
      # So orphan-guard can see whether the kube-vip container's process is alive;
      # that is the entire signal it acts on (see orphan-guard below).
      shareProcessNamespace: true
      serviceAccountName: kube-vip
      # The single guest is untainted, but production tolerates everything on the
      # control plane; keeping the toleration means the manifest is not the thing
      # that differs when someone compares the two.
      tolerations:
        - operator: Exists
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      containers:
        - name: kube-vip
          image: ghcr.io/kube-vip/kube-vip:v0.8.7
          imagePullPolicy: IfNotPresent
          # v0.8.x: the control-plane manager command. Without it the binary prints
          # its help and exits 0, which looks like a Completed pod, not a crash.
          args: ["manager"]
          securityContext:
            capabilities:
              add: ["NET_ADMIN", "NET_RAW", "SYS_TIME"]
          env:
            - name: vip_arp
              value: "true"
            - name: port
              value: "6443"
            # A /32 in production because the address is routed by the LAN; staging
            # keeps the same shape so the two manifests stay comparable.
            - name: vip_cidr
              value: "32"
            - name: cp_enable
              value: "true"
            - name: svc_enable
              value: "false"
            - name: vip_leaderelection
              value: "true"
            # Production uses 5/3/1. That is tight enough that losing the etcd
            # leader - which stalls API writes for ~20-30s while a new leader is
            # elected - makes the leader-election client give up, and kube-vip
            # EXITS (status 255) rather than waiting. Its address then stays on the
            # host interface, another node acquires the lease and adds the same
            # address, and for a while two nodes answer ARP for one VIP.
            # Measured in staging 2026-10-28; see staging/README.md.
            - name: vip_leaseduration
              value: "15"
            - name: vip_renewdeadline
              value: "10"
            - name: vip_retryperiod
              value: "2"
            # br-staging. Without pinning the interface, ARP resolution picks
            # whichever NIC the default route points at - and on this guest the
            # default route is exercised by the tunnel tests.
            # No Prometheus endpoint. kube-vip binds :2112 in the HOST network
            # namespace, so any second process on the same node (a leftover from a
            # Deployment->DaemonSet change, or a restart before the old socket is
            # released) fails with "bind: address already in use" and crash-loops
            # forever - which is what happened in staging on 2026-10-28. Staging does
            # not scrape kube-vip, so the port buys nothing here.
            - name: vip_prometheus
              value: "false"
            - name: vip_interface
              value: "eth1"
            - name: address
              value: "10.10.50.100"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
        - name: orphan-guard
          image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -u
              strikes=0
              misses=0
              while :; do
                # Ours but unwanted: the address is here and no kube-vip process holds it.
                if ! grep -qsx 'kube-vip' /proc/[0-9]*/comm \
                   && ip -4 -o addr show | grep -q "inet $VIP/"; then
                  strikes=$((strikes + 1))
                else
                  strikes=0
                fi
                if [ "$strikes" -ge 3 ]; then
                  addr=$(ip -4 -o addr show | awk -v v="$VIP" '$4 ~ "^" v "/" {print $4; exit}')
                  iface=$(ip -4 -o addr show | awk -v v="$VIP" '$4 ~ "^" v "/" {print $2; exit}')
                  echo "orphan-guard: no kube-vip process here; removing orphaned $addr from $iface"
                  ip addr del "$addr" dev "$iface" 2>/dev/null || true
                  strikes=0
                fi

                # Not ours, but pointing at a node that no longer answers for it. The
                # mirror case, found 2026-10-30: after the lease moved (.82 -> .81) this
                # node kept an ARP entry for the OLD holder's MAC, so every packet to the
                # VIP went to a node that had already given it up. The visible damage is
                # indirect - cilium here cannot reach the API, so it never programs
                # endpoints, so cross-node traffic to this node is punted.
                #
                # The test is deliberately dumb: if this node does not hold the address and
                # the address does not answer, the neighbour entry is suspect. Deleting it
                # costs nothing - the kernel re-resolves on the next packet - and it
                # self-heals whether the cause was a stale MAC, a moved lease or a flapping
                # interface. Two consecutive misses (~60s) so a single dropped ICMP does
                # not churn the cache.
                if ! ip -4 -o addr show | grep -q "inet $VIP/"; then
                  if ping -c1 -W2 "$VIP" >/dev/null 2>&1; then
                    misses=0
                  else
                    misses=$((misses + 1))
                    if [ "$misses" -ge 2 ]; then
                      iface=$(ip route get "$VIP" 2>/dev/null | awk '{for(i=1;i<NF;i++) if ($i=="dev") {print $(i+1); exit}}')
                      if [ -n "${iface:-}" ] && ip neigh show "$VIP" dev "$iface" 2>/dev/null | grep -q .; then
                        echo "orphan-guard: $VIP does not answer and this node is not its holder; flushing stale neighbour entry on $iface"
                        ip neigh del "$VIP" dev "$iface" 2>/dev/null || true
                      fi
                      misses=0
                    fi
                  fi
                else
                  misses=0
                fi
                sleep 5
              done
          env:
            - name: VIP
              value: "10.10.50.100"
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 32Mi
