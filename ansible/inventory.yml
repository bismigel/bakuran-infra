# One host, one reason: the router is the only device in this estate that OpenTofu cannot fully declare.
# `ansible_connection: local` because the collection's modules are API clients — they run on the controller and talk
# to the firewall over HTTPS. This root never opens a shell on the router.
all:
  children:
    router:
      hosts:
        opnsense:
          ansible_host: 192.168.2.1
          ansible_connection: local
