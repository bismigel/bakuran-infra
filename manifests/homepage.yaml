apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  settings.yaml: |
    demo: false
    title: "Bakuran Sosyal Dashboard"
  services.yaml: |
    - Cluster Services:
        - Prometheus:
            href: http://192.168.2.81:30909
            description: Metrics and monitoring
            icon: prometheus
        - Grafana:
            href: http://192.168.2.81:30300
            description: Dashboards
            icon: grafana
        - Kubernetes API:
            href: https://192.168.2.81:6443
            description: k3s API Server
            icon: kubernetes
        - Homepage:
            href: http://192.168.2.81:30080
            description: This dashboard
    - Downloads:
        - qBittorrent:
            href: http://192.168.2.81:30081
            description: Torrent downloads (admin/jRIJqfxHS)
    - Media:
        - Jellyfin:
            href: http://192.168.2.81:30096
            description: Media server with QSV transcoding
            icon: jellyfin
        - Prowlarr:
            href: http://192.168.2.81:30069
            description: Indexer manager for Sonarr/Radarr
        - Sonarr:
            href: http://192.168.2.81:30089
            description: TV show management
        - Radarr:
            href: http://192.168.2.81:30078
            description: Movie management
        - Bazarr:
            href: http://192.168.2.81:30067
            description: Subtitle management
    - Observability:
        - OTel Collector:
            href: http://192.168.2.81:8889/metrics
            description: OpenTelemetry metrics
            icon: otel
  kubernetes.yaml: |
    mode: cluster
    ingress: true
    showNodes: true
    showPods: true
  resources.yaml: |
    cpu: true
    memory: true
    disk: /
  widgets.yaml: |
    - resources:
        cpu: true
        memory: true
        disk: /
    - search:
        provider: duckduckgo
        target: _blank
  bookmarks.yaml: "[]"
  docker.yaml: ""
  custom.css: ""
  custom.js: ""
  proxmox.yaml: ""
  bookmarks.yaml: "[]"
