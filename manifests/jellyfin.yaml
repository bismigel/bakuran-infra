apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: default
  labels:
    app: jellyfin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        supplementalGroups:
          - 303
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:10.9.10
          ports:
            - containerPort: 8096
              name: http
            - containerPort: 8920
              name: https
          env:
            - name: JELLYFIN_PublishedServerUrl
              value: "http://192.168.2.81:8096"
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: cache
              mountPath: /cache
            - name: media
              mountPath: /media
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: cache
          hostPath:
            path: /mnt/downloads
            type: Directory
        - name: media
          hostPath:
            path: /mnt/downloads
            type: Directory
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: default
spec:
  type: NodePort
  selector:
    app: jellyfin
  ports:
    - port: 8096
      targetPort: 8096
      nodePort: 30096
      name: http
    - port: 8920
      targetPort: 8920
      nodePort: 30920
      name: https
