name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # --no-build: the invariant checks are `assert`s evaluated at eval time, so
      # a violation fails here without building three full NixOS systems. Build
      # the real closure with deploy-rs (which has its own checks) when deploying.
      - name: flake checks (evaluate only)
        run: nix flake check --no-build --print-build-logs
      - name: wireguard invariants (explicit)
        run: nix eval --raw .#checks.x86_64-linux.wireguard-invariants.drvPath > /dev/null

      # Story 10.7. `staging-vm/wireguard-test/nixos.qcow2` (9 MiB, committed in #100, gitignored the next day) carried
      # an OpenSSH host private key into this repository's history. A gitignore added afterwards does not remove it, so
      # the rule is checked on what is *tracked* — key-shaped content and disk images both fail.
      - name: No secrets or disk images tracked
        run: python3 scripts/check-repo-hygiene.py
